# 白い熊 Stylus — the fork's build counter.
#
# Our version is upstream's version with this number appended as a fourth component
# (2.4.10 + 3 -> 2.4.10.3). Firefox and AMO accept nothing else there: 1–4 plain
# dot-separated integers, no zero padding, no build metadata — which is why this fork
# does not use the family's "+NNN" form anywhere.
#
# Bumped by every build (tools/build-fork.mjs); reset to 1 by /upstream-new-version.
BUILD_NUMBER=2